<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Interactive Cards - BrasilGuard Visual Lab</title>
<style>
body{margin:0;background:#eef2f7;font-family:system-ui;padding:40px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;max-width:900px;margin:auto}
.card{background:white;border-radius:16px;padding:24px;box-shadow:0 4px 16px #213c5818;transition:transform .2s,box-shadow .2s;cursor:pointer}
.card:hover{transform:translateY(-6px);box-shadow:0 12px 28px #213c5830}
h3{margin:0 0 8px;color:#32455c}
p{margin:0;color:#607186;font-size:14px}
</style>
</head>
<body>
<div class="grid">
  <div class="card"><h3>Módulo 1</h3><p>Fundamentos da informática</p></div>
  <div class="card"><h3>Módulo 2</h3><p>Hardware e conexões</p></div>
  <div class="card"><h3>Módulo 3</h3><p>Sistemas operacionais</p></div>
  <div class="card"><h3>Kids</h3><p>Pré-básico lúdico</p></div>
</div>
</body>
</html>
